services: 
  nginx-webserver:
    image: nginx
    networks:
     - homelab-net
    ports:
     - 8080:80
    volumes:
     - /home/renatubuntu/documentation/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  nginx-test:
    image: nginx
    networks:
     - homelab-net
    volumes:
     - /home/renatubuntu/documentation/nginx-config/nginx-test-config.conf:/etc/nginx/conf.d/default.conf
     - /home/renatubuntu/documentation/Webserver:/usr/share/nginx/html
    restart: unless-stopped

networks:
  homelab-net:
