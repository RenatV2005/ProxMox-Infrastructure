[prod]
ubuntu-prod ansible_host=192.168.0.180 ansible_user=renatubuntu ansible_become_exe=/usr/bin/sudo.ws

[test]
ubuntu-test ansible_host=192.168.0.181 ansible_user=renattest ansible_become_exe=/usr/bin/sudo.ws

[dev]
ubuntu-dev ansible_host=192.168.0.182 ansible_user=renatdev ansible_become_exe=/usr/bin/sudo.ws

[proxmox]
proxmox-host ansible_host=192.168.0.50 ansible_user=root ansible_ssh_private_key_file=~/.ssh/proxmox_ansible

[terraform]
ubuntu-dev-terraform ansible_host=192.168.0.200 ansible_user=renatterraform ansible_become_exe=/usr/bin/sudo.ws

[nonprod:children]
dev
test
terraform

[production:children]
prod
test
dev
terraform
