---
- name: Disable swap on Kubernetes nodes
  hosts: kubernetes
  become: true

  tasks:
    - name: Change /etc/fstab to disable swap
      ansible.builtin.template:
        src: "{{ templates.swap.path }}/fstab.j2"
        dest: "/etc/fstab"
        mode: "0657"

    - name: Disable swap
      ansible.builtin.command:
        cmd: "sudo swapoff -a"
