---
- name: Start Homelab Virtual Machines
  hosts: proxmox
  become: false
  gather_facts: false

  vars:
    proxmox_vms:
      - vmid: 101
        name: ubuntuServer
      - vmid: 300
        name: k8s-control-01
      - vmid: 301
        name: k8s-control-01
      - vmid: 302
        name: k8s-control-02
      - vmid: 311
        name: database-01
      - vmid: 310
        name: application01

  tasks:
    - name: Start selected virtual machines
      ansible.builtin.command:
        cmd: "qm start {{ item.vmid }}"
      loop: "{{ proxmox_vms }}"
      register: vm_start_result
      changed_when: "'started' in vm_start_result.stdout"
      failed_when:
        - vm_start_result.rc != 0
        - "'already running' not in vm_start_result.stderr"
