
log:
  
  level: info

runner:
  
  file: .runner
 
  capacity: 1
  
  envs:
    A_TEST_ENV_NAME_1: a_test_env_value_1
    A_TEST_ENV_NAME_2: a_test_env_value_2
 
  env_file: .env
  
  timeout: 3h

  shutdown_timeout: 0s
 
  insecure: false
  
  fetch_timeout: 5s
  
  fetch_interval: 2s
  
  fetch_interval_max: 5s
  
  log_report_interval: 5s
  
  log_report_max_latency: 3s
  
  log_report_batch_size: 100
  
  state_report_interval: 5s
  
  github_mirror: ''
  
  labels:
  - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"

cache:
  
  enabled: true
  
  dir: ""
 
  host: ""
  
  port: 0
  
  external_server: ""
 
  external_secret: ""

container:
  network: bridge
  privileged: false
  options:
  valid_volumes:
    - /var/run/docker.sock
  workdir_parent:
 
  docker_host: ""
  
  force_pull: false
 
  force_rebuild: false
  
  require_docker: false
 
  docker_timeout: 0s

  bind_workdir: false

host:
 
  workdir_parent:

metrics:
  
  enabled: false

  addr: "127.0.0.1:9101"
